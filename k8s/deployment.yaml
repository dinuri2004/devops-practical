apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-web
  template:
    metadata:
      labels:
        app: flask-web
    spec:
      containers:
        - name: flask-container
          image: dinuri/flask-app:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
